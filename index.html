
<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      // Fix for read-only window.fetch in some iframe / proxy environments
      try {
        let originalFetch = window.fetch;
        Object.defineProperty(window, 'fetch', {
          get() {
            return originalFetch;
          },
          set(value) {
            originalFetch = value;
          },
          configurable: true,
          enumerable: true
        });
      } catch (e) {
        console.warn("Could not patch window.fetch setter:", e);
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ZenterPrime - Early Access</title>
    <meta name="description" content="Simple cloud-synced purchase and stock management system." />
    <meta name="theme-color" content="#4338CA" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            console.log('[PWA] ServiceWorker registered with scope:', reg.scope);
          }).catch((err) => {
            console.warn('[PWA] ServiceWorker registration failed:', err);
          });
        });
      }
    </script>
    
    <!-- Google Fonts: Geologica & Georama (Geometric Sans Fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600;700&family=Georama:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2215%22 fill=%22%234338ca%22/><text x=%2250%%22 y=%2252%%22 text-anchor=%22middle%22 dominant-baseline=%22middle%22 fill=%22%23ffffff%22 style=%22font-size:52px;font-weight:800;font-family:sans-serif%22>Z</text></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Geologica', 'Georama', 'Calibri', 'sans-serif'],
              mono: ['Geologica', 'Georama', 'Calibri', 'sans-serif'],
              serif: ['Geologica', 'Georama', 'Calibri', 'sans-serif'],
            },
            fontSize: {
              'xs': ['13px', '18px'],
              'sm': ['14px', '20px'],
              'base': ['15px', '22px'],
            },
            colors: {
              primary: {
                DEFAULT: '#4338CA',
                dark: '#3730A3',
                light: '#e0e7ff'
              },
              link: '#2563EB',
              slate: {
                50: '#f9f9f9',
                100: '#F1F5F9',
                200: '#E2E8F0',
                300: '#CBD5E1',
                400: '#94A3B8',
                500: '#64748B',
                600: '#475569',
                700: '#334155',
                800: '#1E293B',
                900: '#0F172A',
                950: '#020617',
              }
            },
            borderRadius: {
              'none': '0',
              'sm': '1px',
              'md': '2px',
              'lg': '4px',
              'xl': '6px'
            }
          }
        }
      }
    </script>

    <script>
      // Initial theme setup to avoid FOUC
      const theme = localStorage.getItem('app_theme') || 'light';
      if (theme === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }

      const themeStyle = localStorage.getItem('app_theme_style') || 'modern';
      document.documentElement.setAttribute('data-theme', themeStyle);
    </script>

    <style>
      body { 
        font-family: 'Geologica', 'Georama', sans-serif !important; 
        background-color: #F7F8FC;
        color: #111827;
        font-size: 13.5px !important;
        -webkit-font-smoothing: antialiased;
      }
      .dark body {
        background-color: #020617;
        color: #f1f5f9;
      }
      *, ::before, ::after {
        font-family: 'Geologica', 'Georama', sans-serif !important;
        transition: background-color 0.2s ease-out, 
                    color 0.2s ease-out, 
                    border-color 0.2s ease-out, 
                    fill 0.2s ease-out, 
                    stroke 0.2s ease-out !important;
      }
      button, input, select, textarea, h1, h2, h3, h4, h5, h6, p, span, div, td, th, pre, code, label, .font-mono, .font-sans, .font-serif {
        font-family: 'Geologica', 'Georama', sans-serif !important;
      }

      /* Liquid Glass Header styling for form headers, modals, and sticky top sections */
      .liquid-glass-header {
        background: rgba(255, 255, 255, 0.75) !important;
        -webkit-backdrop-filter: blur(16px) saturate(180%) !important;
        backdrop-filter: blur(16px) saturate(180%) !important;
        border-bottom: 1px solid rgba(226, 232, 240, 0.8) !important;
        box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.04), inset 0 1px 0 0 rgba(255, 255, 255, 0.7) !important;
      }

      .dark .liquid-glass-header {
        background: rgba(15, 23, 42, 0.75) !important;
        -webkit-backdrop-filter: blur(16px) saturate(180%) !important;
        backdrop-filter: blur(16px) saturate(180%) !important;
        border-bottom: 1px solid rgba(30, 41, 59, 0.8) !important;
        box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.35), inset 0 1px 0 0 rgba(255, 255, 255, 0.08) !important;
      }

      /* Liquid Glass Box for inner sticky form action bars */
      .liquid-glass-box {
        background: rgba(255, 255, 255, 0.75) !important;
        -webkit-backdrop-filter: blur(16px) saturate(180%) !important;
        backdrop-filter: blur(16px) saturate(180%) !important;
        border: 1px solid rgba(226, 232, 240, 0.9) !important;
        box-shadow: 0 8px 32px -4px rgba(0, 0, 0, 0.06), inset 0 1px 0 0 rgba(255, 255, 255, 0.8) !important;
      }

      .dark .liquid-glass-box {
        background: rgba(15, 23, 42, 0.75) !important;
        -webkit-backdrop-filter: blur(16px) saturate(180%) !important;
        backdrop-filter: blur(16px) saturate(180%) !important;
        border: 1px solid rgba(30, 41, 59, 0.9) !important;
        box-shadow: 0 8px 32px -4px rgba(0, 0, 0, 0.4), inset 0 1px 0 0 rgba(255, 255, 255, 0.1) !important;
      }

      /* ==========================================
         ZENTERPRIME CLASSIC THEME (GLOBAL SYSTEM)
         ========================================== */
      [data-theme="classic"] body {
        background-color: #f1f5f9 !important;
        color: #0f172a !important;
        font-size: 13px !important;
      }

      [data-theme="classic"].dark body {
        background-color: #080d1a !important;
        color: #f8fafc !important;
      }

      /* 1. Eliminate Shadows, Gradients, and Glassmorphism */
      [data-theme="classic"] *,
      [data-theme="classic"] *::before,
      [data-theme="classic"] *::after {
        box-shadow: none !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        text-shadow: none !important;
      }

      /* 2. Flat Sharp Border Radius */
      [data-theme="classic"] .rounded-2xl,
      [data-theme="classic"] .rounded-xl,
      [data-theme="classic"] .rounded-lg,
      [data-theme="classic"] .rounded-md,
      [data-theme="classic"] .rounded-sm,
      [data-theme="classic"] .rounded-[10px],
      [data-theme="classic"] .rounded-[12px],
      [data-theme="classic"] .rounded-[16px],
      [data-theme="classic"] .rounded-full {
        border-radius: 1px !important;
      }

      /* 3. Solid Headers & Containers (No Glass) */
      [data-theme="classic"] .liquid-glass-header {
        background: #e2e8f0 !important;
        border-bottom: 1px solid #94a3b8 !important;
        box-shadow: none !important;
      }

      [data-theme="classic"].dark .liquid-glass-header {
        background: #1e293b !important;
        border-bottom: 1px solid #475569 !important;
        box-shadow: none !important;
      }

      [data-theme="classic"] .liquid-glass-box {
        background: #ffffff !important;
        border: 1px solid #cbd5e1 !important;
        box-shadow: none !important;
      }

      [data-theme="classic"].dark .liquid-glass-box {
        background: #0f172a !important;
        border: 1px solid #334155 !important;
        box-shadow: none !important;
      }

      /* 4. Desktop ERP Top Header Bar & Sidebar */
      [data-theme="classic"] header {
        background-color: #ffffff !important;
        color: #0f172a !important;
        border-bottom: 1px solid #cbd5e1 !important;
      }

      [data-theme="classic"] header h1,
      [data-theme="classic"] header h2,
      [data-theme="classic"] header span,
      [data-theme="classic"] header button,
      [data-theme="classic"] header div,
      [data-theme="classic"] header p,
      [data-theme="classic"] header input,
      [data-theme="classic"] header select,
      [data-theme="classic"] header svg {
        color: #0f172a !important;
      }

      [data-theme="classic"].dark header {
        background-color: #0f172a !important;
        color: #ffffff !important;
        border-bottom: 1px solid #334155 !important;
      }

      [data-theme="classic"].dark header h1,
      [data-theme="classic"].dark header h2,
      [data-theme="classic"].dark header span,
      [data-theme="classic"].dark header button,
      [data-theme="classic"].dark header div,
      [data-theme="classic"].dark header p,
      [data-theme="classic"].dark header input,
      [data-theme="classic"].dark header select,
      [data-theme="classic"].dark header svg {
        color: #f8fafc !important;
      }

      [data-theme="classic"] header .bg-\[\#00b050\],
      [data-theme="classic"] header .bg-\[\#00b050\] *,
      [data-theme="classic"] header .bg-emerald-600,
      [data-theme="classic"] header .bg-emerald-600 * {
        color: #ffffff !important;
      }

      [data-theme="classic"] aside {
        background-color: #ffffff !important;
        border-right: 1px solid #cbd5e1 !important;
      }

      [data-theme="classic"].dark aside {
        background-color: #0f172a !important;
        border-right: 1px solid #334155 !important;
      }

      /* 5. Cards & Flat Containers */
      [data-theme="classic"] .bg-white {
        background-color: #ffffff !important;
        border-color: #cbd5e1 !important;
      }

      [data-theme="classic"].dark .bg-slate-900,
      [data-theme="classic"].dark .bg-slate-950 {
        background-color: #0f172a !important;
        border-color: #334155 !important;
      }

      [data-theme="classic"] .border,
      [data-theme="classic"] .border-b,
      [data-theme="classic"] .border-t,
      [data-theme="classic"] .border-l,
      [data-theme="classic"] .border-r {
        border-color: #cbd5e1 !important;
      }

      [data-theme="classic"].dark .border,
      [data-theme="classic"].dark .border-b,
      [data-theme="classic"].dark .border-t,
      [data-theme="classic"].dark .border-l,
      [data-theme="classic"].dark .border-r {
        border-color: #334155 !important;
      }

      /* 6. Accounting Data Tables */
      [data-theme="classic"] table {
        border-collapse: collapse !important;
        border: 1px solid #cbd5e1 !important;
        width: 100% !important;
      }

      [data-theme="classic"].dark table {
        border: 1px solid #334155 !important;
      }

      [data-theme="classic"] thead,
      [data-theme="classic"] thead tr,
      [data-theme="classic"] thead th {
        background-color: #e2e8f0 !important;
        color: #0f172a !important;
        font-weight: 700 !important;
        border-bottom: 2px solid #94a3b8 !important;
        border-right: 1px solid #cbd5e1 !important;
      }

      [data-theme="classic"].dark thead,
      [data-theme="classic"].dark thead tr,
      [data-theme="classic"].dark thead th {
        background-color: #1e293b !important;
        color: #f8fafc !important;
        border-bottom: 2px solid #475569 !important;
        border-right: 1px solid #334155 !important;
      }

      [data-theme="classic"] th, 
      [data-theme="classic"] td {
        border: 1px solid #cbd5e1 !important;
        padding: 5px 8px !important;
        font-size: 13px !important;
      }

      [data-theme="classic"].dark th, 
      [data-theme="classic"].dark td {
        border: 1px solid #334155 !important;
      }

      [data-theme="classic"] tbody tr:nth-child(even) {
        background-color: #f8fafc !important;
      }

      [data-theme="classic"].dark tbody tr:nth-child(even) {
        background-color: #0b0f19 !important;
      }

      [data-theme="classic"] tbody tr:hover {
        background-color: #e0f2fe !important; /* Classic light blue row highlight */
      }

      [data-theme="classic"].dark tbody tr:hover {
        background-color: #1e3a8a !important;
      }

      /* 7. Classic Form Controls & Inputs */
      [data-theme="classic"] input,
      [data-theme="classic"] select,
      [data-theme="classic"] textarea {
        border-radius: 1px !important;
        border: 1px solid #94a3b8 !important;
        background-color: #ffffff !important;
        color: #0f172a !important;
        padding: 4px 8px !important;
        font-size: 13px !important;
      }

      [data-theme="classic"].dark input,
      [data-theme="classic"].dark select,
      [data-theme="classic"].dark textarea {
        border: 1px solid #475569 !important;
        background-color: #1e293b !important;
        color: #f8fafc !important;
      }

      [data-theme="classic"] input:focus,
      [data-theme="classic"] select:focus,
      [data-theme="classic"] textarea:focus {
        border-color: #0284c7 !important;
        outline: 1px solid #0284c7 !important;
        background-color: #f0f9ff !important;
      }

      [data-theme="classic"].dark input:focus,
      [data-theme="classic"].dark select:focus,
      [data-theme="classic"].dark textarea:focus {
        background-color: #1e3a8a !important;
      }

      /* 8. Classic Buttons */
      [data-theme="classic"] button {
        border-radius: 1px !important;
        box-shadow: none !important;
        font-weight: 600 !important;
      }

      [data-theme="classic"] .bg-primary,
      [data-theme="classic"] .bg-indigo-600,
      [data-theme="classic"] .bg-blue-600 {
        background-color: #0284c7 !important;
        border: 1px solid #0369a1 !important;
        color: #ffffff !important;
      }

      [data-theme="classic"] .hover\:bg-primary-dark:hover,
      [data-theme="classic"] .hover\:bg-primary\/90:hover,
      [data-theme="classic"] .hover\:bg-indigo-700:hover,
      [data-theme="classic"] .hover\:bg-blue-700:hover {
        background-color: #0369a1 !important;
      }

      /* 9. Light Blue Highlights & Classic Accents */
      [data-theme="classic"] .bg-primary\/10,
      [data-theme="classic"] .bg-blue-50,
      [data-theme="classic"] .bg-indigo-50,
      [data-theme="classic"] .bg-amber-50 {
        background-color: #e0f2fe !important;
        color: #0369a1 !important;
        border: 1px solid #bae6fd !important;
      }

      [data-theme="classic"].dark .bg-primary\/10,
      [data-theme="classic"].dark .bg-blue-50,
      [data-theme="classic"].dark .bg-indigo-50,
      [data-theme="classic"].dark .bg-amber-50 {
        background-color: #1e3a8a !important;
        color: #93c5fd !important;
        border: 1px solid #1e40af !important;
      }

      /* 10. Modals & Dialog Popups */
      [data-theme="classic"] .fixed.inset-0 {
        background-color: rgba(15, 23, 42, 0.45) !important;
      }

      [data-theme="classic"] [role="dialog"],
      [data-theme="classic"] .modal-content,
      [data-theme="classic"] .fixed .bg-white,
      [data-theme="classic"] .fixed .bg-slate-900 {
        border: 1px solid #475569 !important;
        border-radius: 1px !important;
      }

      /* Global Minimum Font Size Rule: Enforce at least 13px - 14px */
      .text-\[10px\], .text-\[11px\], .text-\[12px\], .text-xs,
      [class*="text-[10px]"], [class*="text-[11px]"], [class*="text-[12px]"], [class*="text-[9pt]"] {
        font-size: 13px !important;
      }
      
      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #CBD5E1;
        border-radius: 10px;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #334155;
      }
      
      html, body, #root {
        height: 100%;
        margin: 0;
        padding: 0;
      }

      .clean-table {
        width: 100%;
        border-collapse: collapse;
        background: white;
      }
      .dark .clean-table {
        background: #0F172A;
      }
      .clean-table th {
        background-color: #f1f5f9;
        color: #475569;
        font-weight: 600;
        font-size: 13px !important;
        text-transform: uppercase;
        padding: 10px 14px;
        border: 1px solid #e2e8f0;
        text-align: left;
      }
      .dark .clean-table th {
        background-color: #1e293b;
        color: #94a3b8;
        border-color: #334155;
      }
      .clean-table td {
        padding: 10px 14px;
        border: 1px solid #e2e8f0;
        color: #334155;
        font-size: 13.5px !important;
      }
      .dark .clean-table td {
        border-color: #334155;
        color: #cbd5e1;
      }
      .clean-table tr:hover td {
        background-color: #f7f8fc;
      }
      .dark .clean-table tr:hover td {
        background-color: #1e293b;
      }

      input, select, textarea {
        border-radius: 2px !important;
        font-size: 13.5px !important;
      }

      @media print {
        @page {
          size: A4 portrait;
          margin: 1cm;
        }
        header, aside, .print\:hidden, nav, button {
          display: none !important;
        }
        main {
          padding: 0 !important;
          margin: 0 !important;
          width: 100% !important;
        }
        .clean-table {
          font-size: 11pt !important;
          border: 1px solid #000 !important;
        }
        .clean-table td, .clean-table th {
          border: 1px solid #000 !important;
          font-size: 11pt !important;
        }
      }
    </style>
</head>
  <body class="dark:bg-slate-950 dark:text-slate-100">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
